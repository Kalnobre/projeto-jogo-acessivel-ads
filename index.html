<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória Sonoro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
</head>
<body>

    <header>
        <h1>Jogo da Memória Sonoro</h1>
    </header>

    <main>
        <div id="tela-menu" class="tela">
            <h2 class="titulo-tela">Menu Principal</h2>
            <nav class="menu-opcoes">
                <h3>Novo Jogo:</h3>
                <button id="btn-facil" class="btn-menu">Fácil (2x2)</button>
                <button id="btn-medio" class="btn-menu">Médio (4x2)</button>
                <button id="btn-dificil" class="btn-menu">Difícil (4x4)</button>
                
                <hr>
                
                <button id="btn-continuar" class="btn-menu" disabled>Continuar Jogo Salvo</button>
                <button id="btn-ajuda" class="btn-menu">Ajuda / Instruções</button>
                <button id="btn-creditos" class="btn-menu">Créditos</button>
            </nav>
        </div>

        <div id="tela-jogo" class="tela escondido">
            <div class="controles-jogo">
                <button id="btn-voltar-menu" class="btn-pequeno">Voltar ao Menu</button>
                <button id="btn-reiniciar" class="btn-pequeno">Reiniciar Partida</button>
            </div>

            <div id="game-board" role="grid" aria-label="Tabuleiro do Jogo"></div>
        </div>

        <div id="tela-modal" class="tela escondido" role="dialog" aria-modal="true">
            <h2 id="modal-titulo">Título</h2>
            <p id="modal-texto">Texto...</p>
            <button id="btn-fechar-modal" class="btn-menu">Voltar</button>
        </div>

        <div id="game-status" class="visualmente-escondido" role="alert"></div>
    </main>

    <script src="js/modeloJogo.js"></script>
    <script src="js/visaoJogo.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
