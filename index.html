<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jogo da Memória de Sons — Acessível</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Jogo da Memória de Sons</h1>
  </header>

  <!-- MENU ACESSÍVEL -->
  <nav id="menu-dificuldade" aria-label="Menu de dificuldade">
    <h2 class="visually-hidden">Escolha a dificuldade</h2>

    <div class="menu-list" role="menu" aria-label="Dificuldades">
      <button class="menu-btn" data-pares="4" data-nome="Fácil" role="menuitem" tabindex="0">Fácil — 4 pares</button>
      <button class="menu-btn" data-pares="6" data-nome="Médio" role="menuitem" tabindex="-1">Médio — 6 pares</button>
      <button class="menu-btn" data-pares="8" data-nome="Difícil" role="menuitem" tabindex="-1">Difícil — 8 pares</button>
    </div>

    <!-- ARIA ANNOUNCER invisível -->
    <div id="menu-announcer" class="visually-hidden" role="status" aria-live="polite"></div>
  </nav>

  <!-- ÁREA DO JOGO (escondida até escolha) -->
  <main id="area-jogo" hidden>
    <p class="instrucoes">
      Use as <strong>setas</strong> para navegar e <strong>Enter</strong> ou <strong>Espaço</strong> para selecionar.
    </p>

    <div id="game-board" role="grid" aria-label="Tabuleiro do jogo, 4 colunas"></div>

    <div id="game-status" class="visually-hidden" role="status" aria-live="polite"></div>

    <div class="controls">
      <button id="btn-reiniciar">Reiniciar</button>
      <button id="btn-voltar-menu">Voltar ao menu</button>
    </div>
  </main>

  <script src="js/modeloJogo.js"></script>
  <script src="js/visaoJogo.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
